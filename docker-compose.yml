version: '3.8'

services:
  nfm-x:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nfm-x
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    environment:
      - NFM_APP_NAME=NFM-X
      - NFM_APP_VERSION=4.0.0
      - NFM_DATABASE_URL=sqlite+aiosqlite:///./data/nfm-x.db
      - NFM_OCR_ENABLED=true
      - NFM_COMPRESSION_ENABLED=true
      - NFM_DEBUG=false
      - NFM_ENVIRONMENT=production
    env_file:
      - .env
    networks:
      - nfm-network

  # Optional: Frontend service
  frontend:
    image: node:18-alpine
    container_name: nfm-x-frontend
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - nfm-network
    depends_on:
      - nfm-x

networks:
  nfm-network:
    driver: bridge