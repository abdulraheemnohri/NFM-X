[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Coverage
addopts = --cov=backend --cov-report=term --cov-report=html --cov-fail-under=80

# Verbose output
verbose = 2

# Color output
color = yes

# Show locals on failure
showlocals = yes

# Stop on first failure
failfast = false

# Randomize test order
random_order = yes

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    unit: marks unit tests
    api: marks API tests